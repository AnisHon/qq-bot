[project]
name = "qq-deepseek-bot"
version = "0.1.0"
description = "Lightweight QQ group DeepSeek bot built on NapCat / OneBot 11"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.0",
  "chromadb>=0.5",
  "fastapi>=0.115.0",
  "httpx[socks]>=0.27.0",
  "pypdf>=4.0.0",
  "sentence-transformers>=3.0",
  "tenacity>=9.0.0",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = []
